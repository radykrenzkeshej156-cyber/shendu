<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>深读</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="app">

  <main class="pages">
    <section class="page active" id="p-desk"><div class="page-body" id="deskBody"></div></section>
    <section class="page" id="p-lib"><div class="page-body" id="libBody"></div></section>
    <section class="page" id="p-mind"><div class="page-body" id="mindBody"></div></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="desk" class="active"><span class="ic">⌂</span><span>书桌</span></button>
    <button data-tab="lib"><span class="ic">▤</span><span>书库</span></button>
    <button data-tab="mind"><span class="ic">✧</span><span>思想</span></button>
  </nav>

  <div id="reader" class="reader">
    <header class="reader-top" id="readerTop">
      <button class="rbtn" id="rBack" aria-label="返回">‹</button>
      <div class="r-chap">
        <span id="rChapTitle">——</span>
        <span class="r-progress" id="rProgress"></span>
      </div>
      <button class="rbtn" id="rToc" aria-label="目录">☰</button>
    </header>
    <div class="reader-scroll" id="rScroll">
      <div class="reader-inner" id="rInner"></div>
    </div>
    <footer class="reader-bottom" id="readerBottom">
      <button id="rCo"><span class="ic av" id="rCoAvatar">··</span><span id="rCoName">共读</span></button>
      <button id="rPractice"><span class="ic">→</span><span>实践</span></button>
      <button id="rDetail"><span class="ic">◈</span><span>详情</span></button>
      <button id="rMind"><span class="ic">✧</span><span>思想</span></button>
    </footer>
    <div class="chip-nav" id="rNextHint" hidden><button id="rNextBtn">下一章 ›</button></div>
  </div>

  <div id="coDrawer" class="co-drawer" aria-hidden="true">
    <div class="co-grab"></div>
    <div class="co-head">
      <div class="co-avatar" id="coAvatar">··</div>
      <div class="co-titles">
        <div class="co-name" id="coName">共读</div>
        <div class="co-topic" id="coTopic">——</div>
      </div>
      <button class="co-close" id="coClose" aria-label="收起">⌄</button>
    </div>
    <div class="co-quote" id="coQuote" hidden></div>
    <div class="co-msgs" id="coMsgs"></div>
    <div class="co-tools" id="coTools">
      <button id="coSaveI">记下来</button>
      <button id="coSaveQ">留悬题</button>
      <button id="coSess">话题</button>
    </div>
    <div class="co-input">
      <input id="coInput" placeholder="说说你的理解…" autocomplete="off">
      <button id="coSend" aria-label="发送">→</button>
    </div>
  </div>

  <div id="selBar" class="sel-bar"></div>
  <div id="sheetRoot"></div>
  <div id="toast" class="toast"></div>
</div>
<script src="epub.js"></script>
<script src="app.js"></script>
</body>
</html>
