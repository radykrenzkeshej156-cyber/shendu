<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>深读</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="day">
<div id="app" class="app">

  <main class="pages">
    <section class="page active" id="p-desk"><div class="page-body" id="deskBody"></div></section>
    <section class="page" id="p-lib"><div class="page-body" id="libBody"></div></section>
    <section class="page" id="p-mind"><div class="page-body" id="mindBody"></div></section>
    <section class="page" id="p-life"><div class="page-body" id="lifeBody"></div></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="desk" class="active"><span class="ic">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><circle cx="12" cy="12" r="9"/></svg>
    </span><span>此刻</span></button>
    <button data-tab="lib"><span class="ic">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V6"/><path d="M4 6h12l2 3 2 9H4"/><path d="M8.5 6 10 9.5h7"/><path d="M4 20h16"/></svg>
    </span><span>书架</span></button>
    <button data-tab="mind"><span class="ic">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7.5h10"/><path d="M7 12h10"/><path d="M7 16.5h6"/><rect x="3.5" y="3.5" width="17" height="17" rx="3"/></svg>
    </span><span>思想</span></button>
    <button data-tab="life"><span class="ic">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4c1 5 4 7.5 8 8"/><path d="M12 5c-4 0-6.5 1.5-7.5 4 4 .5 6.5 2 7.5 5.5 2.5-3.5 2.5-6.5 0-9.5z"/></svg>
    </span><span>生活</span></button>
  </nav>

  <div id="reader" class="reader">
    <header class="reader-top" id="readerTop">
      <button class="rbtn" id="rBack" aria-label="返回">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-width="1.8" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="r-chap">
        <span id="rChapTitle">——</span>
        <span class="r-progress" id="rProgress"></span>
      </div>
      <button class="rbtn" id="rToc" aria-label="目录">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-width="1.8" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
      </button>
    </header>
    <div id="rCarryBar" class="r-carry" hidden></div>
    <div class="reader-scroll" id="rScroll">
      <div class="reader-inner" id="rInner"></div>
    </div>
    <footer class="reader-bottom" id="readerBottom">
      <button id="rCo"><span class="ic">
        <svg viewBox="0 0 24 24" class="av-ico" width="20" height="20" fill="none" stroke-width="1.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 10h.01M15.5 10h.01M8.5 14.5c1.2.9 2.6 1.3 3.5 1.3s2.3-.4 3.5-1.3"/></svg>
      </span><span id="rCoName">共读</span></button>
      <button id="rDetail"><span class="ic">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke-width="1.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4M12 16h.01"/></svg>
      </span><span>详情</span></button>
      <button id="rMind"><span class="ic">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke-width="1.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="3"/><path d="M8 9h8M8 12.5h8M8 16h5"/></svg>
      </span><span>思想</span></button>
    </footer>
    <div class="chip-nav" id="rNextHint" hidden><button id="rNextBtn">下一章 ›</button></div>
  </div>

  <div id="coDrawer" class="co-drawer" aria-hidden="true">
    <div class="co-grab"></div>
    <div class="co-head">
      <div class="co-avatar" id="coAvatar">··</div>
      <div class="co-titles">
        <div class="co-name" id="coName">共读</div>
        <div class="co-topic" id="coTopic">——</div>
      </div>
      <button class="co-close" id="coClose" aria-label="收起">⌄</button>
    </div>
    <div class="co-quote" id="coQuote" hidden></div>
    <div class="co-msgs" id="coMsgs"></div>
    <div class="co-tools" id="coTools">
      <button id="coSaveI">记下来</button>
      <button id="coSaveQ">留悬题</button>
      <button id="coCtx">上下文</button>
      <button id="coSess">话题</button>
      <button id="coRefresh">刷新位置</button>
    </div>
    <div class="co-input">
      <input id="coInput" placeholder="说说你的理解…" autocomplete="off">
      <button id="coSend" aria-label="发送">→</button>
    </div>
  </div>

  <div id="selBar" class="sel-bar"></div>
  <div id="sheetRoot"></div>
  <div id="toast" class="toast"></div>
</div>
<script src="epub.js"></script>
<script src="app.js"></script>
</body>
</html>
